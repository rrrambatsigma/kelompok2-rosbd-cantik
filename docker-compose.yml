networks:
  flight-net:
    driver: bridge

volumes:
  elasticsearch-data:
  grafana-data:
  zookeeper-data:
  kafka-data:

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:6.2.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-data:/var/lib/zookeeper/log
    networks:
      - flight-net

  kafka:
    image: confluentinc/cp-kafka:6.2.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - flight-net
    depends_on:
      - zookeeper

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    networks:
      - flight-net

  spark:
    image: jupyter/pyspark-notebook:latest
    container_name: spark
    ports:
      - "8888:8888"
      - "4040:4040"
    networks:
      - flight-net

  sedona:
    image: apache/sedona:latest
    container_name: sedona
    ports:
      - "8081:8080"
    networks:
      - flight-net
    command: ["tail", "-f", "/dev/null"]

  neug:
    image: alpine:latest
    container_name: neug
    command: ["tail", "-f", "/dev/null"]
    networks:
      - flight-net

  # ES lokal - untuk sistem Kibana & service ingester/optimizer/anomaly/saver
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      # Aktifkan Cross-Cluster Search ke ES teman via Tailscale
      - cluster.remote.teman.seeds=100.99.130.69:9300
      - reindex.remote.whitelist=100.99.130.69:9200
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    extra_hosts:
      - "host-gateway:host-gateway"
    networks:
      - flight-net

  # Kibana pakai ES LOKAL (supaya index sistem .kibana tersedia)
  # Data teman diakses via Cross-Cluster Search dari Kibana: teman:nama_index
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - TELEMETRY_ENABLED=false
      - LOGGING_VERBOSE=true
    depends_on:
      - elasticsearch
    networks:
      - flight-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PLUGINS_PLUGIN_ADMIN_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - flight-net
    depends_on:
      - elasticsearch

  ingester:
    build: .
    container_name: ingester
    depends_on:
      - kafka
      - elasticsearch
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ELASTICSEARCH_HOST=elasticsearch:9200
    volumes:
      - ./credentials.json:/app/credentials.json
    command: ["python", "-u", "ingest/ingester.py"]
    networks:
      - flight-net

  optimizer:
    build: .
    container_name: optimizer
    ports:
      - "8000:8000"
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOST=elasticsearch:9200
    command: ["uvicorn", "ingest.optimizer:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - flight-net

  vae-serving:
    build: .
    container_name: vae-serving
    ports:
      - "8001:8001"
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOST=elasticsearch:9200
    volumes:
      - ./models:/app/models
    command: ["uvicorn", "serving.api:app", "--host", "0.0.0.0", "--port", "8001"]
    networks:
      - flight-net

  anomaly:
    build: .
    container_name: anomaly
    depends_on:
      - kafka
      - elasticsearch
      - vae-serving
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ELASTICSEARCH_HOST=elasticsearch:9200
      - SERVING_URL=http://vae-serving:8001
    command: ["python", "serving/detector.py"]
    networks:
      - flight-net

  saver:
    build: .
    container_name: saver
    depends_on:
      - kafka
      - elasticsearch
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ELASTICSEARCH_HOST=elasticsearch:9200
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    command: ["python", "-u", "ingest/saver.py"]
    networks:
      - flight-net