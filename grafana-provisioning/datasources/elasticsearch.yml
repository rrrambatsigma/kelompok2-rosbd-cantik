apiVersion: 1

datasources:
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "[anomaly-stream,anomaly-stream-if,flights]"
    isDefault: true
    jsonData:
      esVersion: 8.11.0
      timeField: processed_at
      logMessageField: "callsign"
      logLevelField: "attack_type"
