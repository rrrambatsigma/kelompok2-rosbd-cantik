apiVersion: 1

datasources:
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "[anomaly-stream,anomaly-results,model-performance,flights]"
    isDefault: true
    jsonData:
      esVersion: 8.11.0
      timeField: timestamp
      interval: "10s"
      logMessageField: "callsign"
      logLevelField: "attack_type"
